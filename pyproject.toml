[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rad-gardes-automator"
version = "5.0.0"
description = "Attribution des gardes de radiologues — classeur Excel simple, app macOS et Windows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Projet Gardes" }]
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.scripts]
gardes = "gardes_simple.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gardes_simple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
