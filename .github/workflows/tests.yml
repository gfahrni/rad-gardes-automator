name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les bibliothèques Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3
      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
