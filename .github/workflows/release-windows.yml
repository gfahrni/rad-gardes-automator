name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.16.0

      - name: Construire l'application onedir
        run: pyinstaller --noconfirm --clean rad-gardes-automator.spec

      - name: Ajouter les documents
        run: |
          Copy-Item README.md dist/RAD-Gardes-Automator/README.md
          Copy-Item LICENSE dist/RAD-Gardes-Automator/LICENSE

      - name: Self-test du pipeline
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/RAD-Gardes-Automator/RAD-Gardes-Automator.exe" `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Self-test pipeline échoué : code $($process.ExitCode)"
          }

      - name: Smoke test de l'interface
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process `
            -FilePath "dist/RAD-Gardes-Automator/RAD-Gardes-Automator.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Smoke test UI échoué : code $($process.ExitCode)"
          }

      - name: Créer l'archive ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/RAD-Gardes-Automator/*" `
            -DestinationPath "dist/RAD-Gardes-Automator-windows-x64.zip" `
            -Force

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAD-Gardes-Automator-windows-x64
          path: dist/RAD-Gardes-Automator-windows-x64.zip
          if-no-files-found: error

      - name: Créer la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RAD-Gardes-Automator-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
