# Build V5 Windows portable : manuel ou tag v5*.
# L'app macOS se construit localement (packaging/build-macos.sh) : les runners
# macOS ne sont pas disponibles sur cette installation GitHub Actions.
name: release-v5

on:
  workflow_dispatch:
  push:
    tags:
      - "v5*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Tests
        run: python -m pytest -q

      - name: Construire l'exe portable
        run: pyinstaller packaging/rad_gardes_v5.spec --noconfirm --clean --distpath dist

      - name: Ajouter le classeur type et le mode d'emploi
        shell: pwsh
        run: |
          $Dossier = "dist\RAD Gardes V5"
          Copy-Item examples\gardes-in-vide.xlsx $Dossier
          Copy-Item examples\gardes-in-demo.xlsx $Dossier
          Copy-Item packaging\LISEZ-MOI-windows.txt $Dossier

      - name: Self-test de l'exe
        shell: pwsh
        run: |
          Copy-Item examples\gardes-in-demo.xlsx "$env:TEMP\in.xlsx" -Force
          $p = Start-Process -FilePath "dist\RAD Gardes V5\RAD Gardes V5.exe" `
               -ArgumentList '--entree', "$env:TEMP\in.xlsx" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test échoué : code $($p.ExitCode)" }
          if (-not (Test-Path "$env:TEMP\in-resultat.xlsx")) { throw "Aucun résultat produit" }
          Write-Host "Self-test OK : résultat produit."

      - name: Créer l'archive ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\RAD Gardes V5\*" `
            -DestinationPath "dist\RAD-Gardes-V5-windows-x64.zip" -Force

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAD-Gardes-V5-windows-x64
          path: dist/RAD-Gardes-V5-windows-x64.zip
          if-no-files-found: error

      - name: Créer la release
        if: startsWith(github.ref, 'refs/tags/v5')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RAD-Gardes-V5-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
